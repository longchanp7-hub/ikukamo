name: daily-fetch (no AI)
on:
  push:
    branches: [main]
    paths: ['config/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/daily-fetch.yml']
  schedule:
    # 00:17 JST. The hosted scheduler has recently slipped by several hours,
    # so start shortly after midnight and keep a wide buffer before the 09:00 health check.
    - cron: '17 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ikukamo-official-collection
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      changed: ${{ steps.save.outputs.changed }}
      commit: ${{ steps.save.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Skip a late duplicate scheduled collection
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('src/data/collected-events.json','utf8'));
          const day = value => new Intl.DateTimeFormat('sv-SE', {
            timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit'
          }).format(new Date(value));
          const today = day(new Date());
          const sources = Array.isArray(data.sources) ? data.sources : [];
          const fresh = sources.length > 0 && sources.every(source =>
            source.status === 'ok' &&
            Number(source.errors || 0) === 0 &&
            source.checkedAt &&
            day(source.checkedAt) === today
          );
          process.exit(fresh ? 0 : 1);
          NODE
          then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Today's JST collection is already healthy; skipping this late scheduled duplicate."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.run == 'true'
        with:
          version: 11.19.0
      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts --prod
      - if: steps.gate.outputs.run == 'true'
        run: node --test tests/collector.test.mjs tests/discovery.test.mjs
      - name: Collect only configured official sources
        if: steps.gate.outputs.run == 'true'
        run: node scripts/ingest.mjs
      - name: Validate dates, places, sources and duplicate IDs
        if: steps.gate.outputs.run == 'true'
        run: node scripts/validate-collection.mjs
      - name: Commit validated changes only
        if: steps.gate.outputs.run == 'true'
        id: save
        run: |
          if ! git diff --quiet -- src/data/collected-events.json; then
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "::warning title=Concurrent main update::main advanced during collection; skip stale snapshot write. The next scheduled collection retries safely."
            else
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git add src/data/collected-events.json
              git commit -m "Refresh validated official source information"
              git push origin HEAD:main
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify unchanged published app
        if: always() && steps.gate.outputs.run == 'true' && steps.save.outputs.changed != 'true'
        run: node scripts/ops-health.mjs
      - name: Verify already-fresh published app
        if: steps.gate.outputs.run == 'false'
        run: |
          node scripts/ops-health.mjs
          node scripts/verify-public-collection.mjs
      - name: Preserve collection diagnostics
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: collection-diagnostics
          path: tmp/ingest-report.json
          retention-days: 3
      - name: Report official source degradation
        if: steps.gate.outputs.run == 'true'
        run: |
          node <<'NODE'
          const d = require('./src/data/collected-events.json');
          const degraded = d.sources.filter(source => source.errors > 0 || source.status !== 'ok');
          for (const source of degraded) {
            console.log(`::warning title=Official source degraded::${source.name}: status=${source.status}, errors=${source.errors}, retained=${source.retained}`);
          }
          if (degraded.length) {
            console.log(`${degraded.length} official source(s) degraded; retained validated data remains available. The collection run itself is not failed unless ingest/validation fails.`);
          }
          NODE
  deploy:
    needs: ingest
    if: always() && needs.ingest.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.ingest.outputs.commit }}
