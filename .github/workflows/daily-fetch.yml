name: daily-fetch (no AI)
on:
  push:
    branches: [main]
    paths: ['config/official-sources.json', 'scripts/official-collector.mjs', 'scripts/ingest.mjs', '.github/workflows/daily-fetch.yml']
  schedule:
    - cron: '20 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ikukamo-official-collection
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.save.outputs.changed }}
      commit: ${{ steps.save.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/collector.test.mjs
      - name: Collect only configured official sources
        run: node scripts/ingest.mjs
      - name: Commit validated changes only
        id: save
        run: |
          if ! git diff --quiet -- src/data/collected-events.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/data/collected-events.json
            git commit -m "Refresh validated official source information"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify published app
        if: always()
        run: node scripts/ops-health.mjs
  deploy:
    needs: ingest
    if: needs.ingest.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.ingest.outputs.commit }}
