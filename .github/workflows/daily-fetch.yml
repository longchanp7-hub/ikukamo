name: daily-fetch (no AI)
on:
  push:
    branches: [main]
    paths: ['config/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/daily-fetch.yml']
  schedule:
    # 03:17 JST. Leave a large buffer before the 09:00 operations health check
    # because GitHub-hosted scheduled workflows can be delayed in the queue.
    - cron: '17 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ikukamo-official-collection
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      changed: ${{ steps.save.outputs.changed }}
      commit: ${{ steps.save.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts --prod
      - run: node --test tests/collector.test.mjs tests/discovery.test.mjs
      - name: Collect only configured official sources
        run: node scripts/ingest.mjs
      - name: Validate dates, places, sources and duplicate IDs
        run: node scripts/validate-collection.mjs
      - name: Commit validated changes only
        id: save
        run: |
          if ! git diff --quiet -- src/data/collected-events.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/data/collected-events.json
            git commit -m "Refresh validated official source information"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify unchanged published app
        if: always() && steps.save.outputs.changed != 'true'
        run: node scripts/ops-health.mjs
      - name: Preserve collection diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: collection-diagnostics
          path: tmp/ingest-report.json
          retention-days: 3
      - name: Report official source failures
        run: node -e "const d=require('./src/data/collected-events.json'); if(d.sources.some(s=>s.errors>0)) process.exit(1)"
  deploy:
    needs: ingest
    if: always() && needs.ingest.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.ingest.outputs.commit }}
