name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint && pnpm typecheck && pnpm test --maxWorkers=1
      - run: node --test tests/collector.test.mjs tests/discovery.test.mjs
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /ikukamo
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install isolated browser test tools
        run: |
          npm install --prefix /tmp/ikukamo-browser --no-save --package-lock=false playwright@1.62.1
          /tmp/ikukamo-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/browser-smoke.cjs
        env:
          NODE_PATH: /tmp/ikukamo-browser/node_modules
