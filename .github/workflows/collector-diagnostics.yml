name: collector-connectivity-diagnostics
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/diagnose-connectivity.mjs', '.github/workflows/collector-diagnostics.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/diagnose-connectivity.mjs
